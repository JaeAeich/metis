[workspace]
members = [ "crates/api", "crates/common", "crates/engine", "crates/engines/generic" ]
resolver = "3"

[workspace.dependencies]
async-nats = "0.44.2"
envy = "0.4.2"
redis = { features = [ "aio", "tokio-comp" ], version = "0.32.7" }
serde = { features = [ "derive" ], version = "1.0.228" }
serde_json = "1.0"
sqlx = { default-features = false, features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
], version = "0.8.6" }
tokio = { features = [ "full" ], version = "1.50.0" }
tracing = "0.1.44"
tracing-subscriber = { features = [ "env-filter", "json" ], version = "0.3.22" }
utoipa = { features = [ "axum_extras", "chrono", "uuid" ], version = "5.4.0" }
uuid = { features = [ "serde", "v7" ], version = "1.21.0" }

[workspace.lints.clippy]
all = "deny"
clone_on_copy = "warn"
complexity = "deny"
correctness = "deny"
dbg_macro = "deny"
expect_used = "deny"
large_enum_variant = "warn"
large_stack_arrays = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
panic = "deny"
pedantic = "warn"
perf = "deny"
redundant_clone = "warn"
style = "warn"
suspicious = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "warn"
