pre-commit:
  parallel: true
  commands:
    editorconfig:
      run: mise x -- eclint fix {staged_files}
      stage_fixed: true

    toml-hygiene:
      glob: "{*.toml,**/*.toml}"
      run: >
        mise x -- toml-sort --in-place --all --trailing-comma-inline-array {staged_files}
        && mise x -- taplo format {staged_files}
      stage_fixed: true

    markdownlint:
      glob: "**/*.md"
      run: mise x -- markdownlint --fix {staged_files}
      stage_fixed: true

    yaml-hygiene:
      glob: "**/*.{yaml,yml}"
      run: >
        mise x -- yamlfmt {staged_files}
        && mise x -- yamllint -c .yamllint {staged_files}
      stage_fixed: true

    rustfmt:
      glob: "**/*.rs"
      run: cargo +nightly fmt
      stage_fixed: true

    shfmt:
      glob: "**/*.{sh,bash,zsh}"
      run: mise x -- shfmt -w -s -i 2 {staged_files}
      stage_fixed: true

    typos:
      run: mise x -- typos
      stage_fixed: true

    biome:
      glob: "app/**/*.{html,css,js,json}"
      run: mise x -- biome check --write --unsafe {staged_files}
      stage_fixed: true

    sqlfluff:
      glob: "**/*.sql"
      run: mise x -- sqlfluff fix --dialect postgres {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: >
        NODE_PATH="$(mise where 'npm:@commitlint/config-conventional')/lib/node_modules"
        "$(mise where 'npm:@commitlint/cli')/bin/commitlint" --edit {1}
