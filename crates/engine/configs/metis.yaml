version: 1.0.0

# Engine Configuration for WES API
# This config defines how WES requests map to engine CLI commands
engine:
  # ============================================================================
  # BASIC ENGINE METADATA
  # ============================================================================
  name: Nextflow
  version: 23.04.0

  # Workflow capabilities
  workflowTypes:
    - NFL
  workflowTypeVersions:
    - DSL2

  # ============================================================================
  # COMMAND TEMPLATE
  # ============================================================================
  # The command template defines how the final CLI command is constructed.
  #
  # Available template variables:
  #   {workflow_url}      - Original workflow URL from WES request
  #   {workflow_path}     - Local filesystem path after workflow download
  #   {workflow_params}   - Processed workflow parameters as CLI string
  #   {engine_params}     - Processed engine parameters as CLI string
  #   {workdir}           - Working directory path for this run
  #   {run_id}            - Unique identifier for this workflow run
  #   {user_id}           - User ID who submitted the workflow
  #   {params_file}       - Path to workflow parameters JSON/YAML file (if written)
  #   {logs_dir}          - Directory for workflow logs
  #   {outputs_dir}       - Directory for workflow outputs
  #   {timestamp}         - ISO 8601 timestamp when run was submitted
  #   {date}              - Date in YYYY-MM-DD format
  #   {time}              - Time in HH-MM-SS format
  #
  # Examples:
  #   Nextflow:     "nextflow run {workflow_path} {engine_params} {workflow_params}"
  #   Cromwell:     "java -jar /opt/cromwell.jar run {workflow_path} -i {params_file} -o {engine_params_file}"
  #   Snakemake:    "snakemake --snakefile {workflow_path}/Snakefile {engine_params} --config {workflow_params}"
  #   CWL:          "cwltool {engine_params} {workflow_path} {params_file}"
  #   WDL:          "miniwdl run {workflow_path} -i {params_file} {engine_params}"
  #
  commandTemplate: "nextflow run {workflow_path} {engine_params} {workflow_params}"

  # The backend to use for running the workflow
  # Allowed backends are local and TES
  backend: local
  # ============================================================================
  # WORKFLOW PARAMETERS STYLE
  # ============================================================================
  # Defines how workflow-level parameters (not engine params) are passed to the engine.
  #
  # method options:
  #   "inline"  - Pass parameters directly in command line: --param key=value
  #   "file"    - Write parameters to file and pass file path: --params-file params.json
  #
  # When method is "file":
  #   format: "json" | "yaml" | "properties"
  #   filePath: "{workdir}/params.{format}" (supports template variables)
  #
  workflowParams:
    style:
      method: "inline"
      prefix: "--" # Prefix for parameter keys
      separator: " " # Separator between key and value (" " or "=")
      keyValueFormat: "{key}={value}" # Format string for each param

      # Alternative for file-based:
      # method: "file"
      # format: "json"
      # filePath: "{workdir}/workflow-params.json"

  # ============================================================================
  # ENGINE PARAMETER SPECIFICATIONS
  # ============================================================================
  # Each parameter defines:
  # - How it maps from WES request to CLI
  # - Type validation and constraints
  # - Sensitivity (for redaction in logs/responses)
  # - Default values and behavior
  #
  engineParams:
    # Behaviour for unknown engine params:
    # - "reject": Reject requests that include unknown flags (RECOMMENDED for security)
    # - "pass": Forward unknown flags as-is to the engine (use with extreme caution)
    # - "strip": Log unknown flags and strip them before running (moderate security)
    unknownParamsBehavior: reject
    validatedParams:
      # ------------------------------------------------------------------
      # EXAMPLE: List parameter with enum validation
      # ------------------------------------------------------------------
      - names: # Multiple aliases accepted in WES request
          - "profile"
          - "-profile"
          - "profiles"
        cliFlag: "-profile" # Actual CLI flag passed to engine
        type: list # Type: string | list | bool | int | float
        default: ["docker"] # Default value (used when strictDefault=true or user omits)
        strictDefault: false # If true, ignore user value and always use default
        required: false # If true, validation fails if parameter is missing
        sensitive: false # If true, redact from logs and API responses
        listSeparator: "," # How to join list items in CLI (for list type)
        validate:
          - type: enum
            allowed: ["docker", "local", "k8s", "aws", "gcp", "azure"]
            message: "Profile must be one of: docker, local, k8s, aws, gcp, azure"
        description: "Execution profile(s) to use. Multiple profiles can be combined."

      # ------------------------------------------------------------------
      # EXAMPLE: Boolean flag parameter
      # ------------------------------------------------------------------
      - names:
          - "resume"
          - "-resume"
        cliFlag: "-resume"
        type: bool
        default: false
        strictDefault: false
        required: false
        sensitive: false
        booleanStyle: "flag" # Options: "flag" (-resume), "value" (-resume true), "equals" (-resume=true)
        description: "Resume previous run from cached results"

      # ------------------------------------------------------------------
      # EXAMPLE: String parameter with regex validation
      # ------------------------------------------------------------------
      - names:
          - "work-dir"
          - "-work-dir"
          - "-w"
        cliFlag: "-work-dir"
        type: string
        default: null
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: regex
            pattern: "^/[a-zA-Z0-9/_-]+$"
            message: "Work directory must be an absolute path with valid characters"
          - type: custom
            rule: "no_parent_traversal"
            message: "Path traversal (..) is not allowed"
        description: "Working directory for intermediate execution files"

      # ------------------------------------------------------------------
      # EXAMPLE: Integer parameter with range validation
      # ------------------------------------------------------------------
      - names:
          - "max-cpus"
          - "maxCpus"
        cliFlag: "--max-cpus"
        type: int
        default: null
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: range
            min: 1
            max: 128
            message: "CPU count must be between 1 and 128"
        description: "Maximum number of CPUs to use across all tasks"

      # ------------------------------------------------------------------
      # EXAMPLE: Sensitive parameter passed as environment variable
      # ------------------------------------------------------------------
      - names:
          - "access-token"
          - "token"
          - "tower-token"
        cliFlag: "-with-tower" # CLI flag to enable Tower integration
        type: string
        default: null
        strictDefault: false
        required: false
        sensitive: true # Will be redacted in logs and responses
        envVar: "TOWER_ACCESS_TOKEN" # Pass as env var instead of CLI arg
        validate:
          - type: regex
            pattern: "^[a-zA-Z0-9_-]{20,}$"
            message: "Token must be alphanumeric and at least 20 characters"
        description: "Access token for Nextflow Tower monitoring"

      # ------------------------------------------------------------------
      # EXAMPLE: File path parameter with existence validation
      # ------------------------------------------------------------------
      - names:
          - "config"
          - "-c"
        cliFlag: "-c"
        type: string
        default: null
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: file_exists
            message: "Config file must exist and be readable"
          - type: file_extension
            allowed: [".config", ".cfg", ".conf"]
            message: "Config file must have .config, .cfg, or .conf extension"
        description: "Path to additional Nextflow configuration file"

      # ------------------------------------------------------------------
      # EXAMPLE: Float parameter (memory, disk, etc.)
      # ------------------------------------------------------------------
      - names:
          - "max-memory"
          - "maxMemory"
        cliFlag: "--max-memory"
        type: string # Often easier to validate as string with pattern
        default: "16GB"
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: regex
            pattern: "^[0-9]+(\\.[0-9]+)?(GB|MB|TB)$"
            message: "Memory must be specified as number with unit (e.g., 16GB, 1.5TB)"
        description: "Maximum memory to use (e.g., 16GB, 1.5TB)"

      # ------------------------------------------------------------------
      # EXAMPLE: Parameter with multiple validations
      # ------------------------------------------------------------------
      - names:
          - "output-dir"
          - "outdir"
        cliFlag: "--outdir"
        type: string
        default: "{workdir}/outputs" # Can use template variables
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: regex
            pattern: "^/[a-zA-Z0-9/_-]+$"
            message: "Output directory must be an absolute path"
          - type: custom
            rule: "no_parent_traversal"
          - type: custom
            rule: "writable_directory"
            message: "Output directory must be writable"
        description: "Directory where workflow outputs will be saved"

  # ============================================================================
  # SECURITY: DENIED PARAMETERS
  # ============================================================================
  # Parameters that must NEVER be allowed, even if they match known params.
  # This is the last line of defense against malicious input.
  #
  deniedParams:
    # Exact string matches (case-sensitive)
    - pattern: "--admin-password"
      type: exact
      reason: "Admin credentials are not allowed in workflow parameters"

    - pattern: "--privileged"
      type: exact
      reason: "Privileged mode is a container escape risk"

    - pattern: "-with-docker"
      type: exact
      reason: "Use 'profile' parameter instead to manage Docker execution"

    - pattern: "--host"
      type: exact
      reason: "Host configuration is managed by WES, not user-configurable"

    - pattern: "--root"
      type: exact
      reason: "Root access is not permitted"

    # Regex patterns for broader catching
    - pattern: ".*DROP\\s+TABLE.*"
      type: regex
      reason: "SQL injection attempt detected"

    - pattern: ".*rm\\s+-rf\\s+/.*"
      type: regex
      reason: "Dangerous system command detected"

    - pattern: ".*; .+;"
      type: regex
      reason: "Command injection attempt detected (semicolon chaining)"

    - pattern: ".*\\$\\(.*\\).*"
      type: regex
      reason: "Shell command substitution is not allowed"

    - pattern: ".*`.*`.*"
      type: regex
      reason: "Shell command execution via backticks is not allowed"

  # ============================================================================
  # IGNORED PARAMETERS
  # ============================================================================
  # Parameters to silently strip from requests without failing validation.
  # Use this for deprecated parameters or internal debugging flags.
  #
  ignoredParams:
    - "--debug-internal"
    - "--experimental-feature-x"
    - "--legacy-option"

  # Lua scripts that are run after the engine command has been executed
  # or failed, used to parse output files into a WES output schema and
  # TaskLog schema.
  # The script is ran in the workdir of the workflow execution with
  # the following environment variables:
  #   - RUN_ID
  #   - USER_ID
  wesParser:
    outputs:
      scriptPath: "/path/to/script.lua"
      scriptContent: |
        -- Your script content here
    taskLogs:
      scriptPath: "/path/to/tasklog.lua"
      scriptContent: |
        -- Your script content here

runs:
  # ============================================================================
  # WORKING DIRECTORY SETUP
  # ============================================================================
  # Defines where workflow execution occurs and how directories are organized.
  #
  # Available pattern variables:
  #   {run_id}      - Unique workflow run identifier
  #   {user_id}     - User who submitted the workflow
  #   {date}        - Date in YYYY-MM-DD format
  #   {time}        - Time in HH-MM-SS format
  #   {timestamp}   - Unix timestamp
  #
  # Pattern examples:
  #   Simple:           "{run_id}"
  #   User-based:       "{user_id}/{run_id}"
  #   Date-organized:   "{date}/{run_id}"
  #   Hierarchical:     "{user_id}/{date}/{run_id}"
  #
  workdir:
    base: "/var/wes/runs"
    pattern: "{user_id}/{run_id}"
    # Optional: subdirectories to create within workdir
    # These will be available as template variables
    subdirs:
      logs: "logs" # Available as {logs_dir}
      outputs: "outputs" # Available as {outputs_dir}
      work: "work" # Available as {workdir}
      temp: "tmp" # Available as {tmp_dir}

  # Template a run level config file which will be put in {workdir}
  # Useful for creating custom configurations for each run to modify
  # workflow behavior, this file will be exposed to all the template variables.
  config:
    filepath: "{run_id}.yaml"
    content: |
      process: {
        "key": "value",
        "another_key": "another_value"
      }
      workdir: s3://bucket/{user_id}/{run_id}

  # Lua script hooks that can be executed before and after workflow execution
  # They are executed in the following order:
