version: 1.0.0

# Manual Test Engine Configuration
# This config tests the command building pipeline without actual execution

engine:
  # ============================================================================
  # BASIC ENGINE METADATA
  # ============================================================================
  name: Nextflow
  version: 23.04.0

  workflowTypes:
    - NFL
  workflowTypeVersions:
    - DSL2

  # ============================================================================
  # COMMAND TEMPLATE
  # ============================================================================
  # Available template variables:
  #   {workflow_url}      - Original workflow URL from WES request
  #   {workflow_path}     - Local filesystem path after workflow download
  #   {workflow_params}   - Processed workflow parameters as CLI string
  #   {engine_params}     - Processed engine parameters as CLI string
  #   {workdir}           - Working directory path for this run
  #   {run_id}            - Unique identifier for this workflow run
  #   {user_id}           - User ID who submitted the workflow
  #   {params_file}       - Path to workflow parameters JSON/YAML file
  #   {logs_dir}          - Directory for workflow logs
  #   {outputs_dir}       - Directory for workflow outputs
  #   {timestamp}         - ISO 8601 timestamp when run was submitted
  #   {date}              - Date in YYYY-MM-DD format
  #   {time}              - Time in HH-MM-SS format
  commandTemplate: "nextflow run {workflow_path} {engine_params} {workflow_params}"

  backend: local

  # ============================================================================
  # WORKFLOW PARAMETERS STYLE
  # ============================================================================
  workflowParams:
    style:
      method: "file"
      prefix: "--"
      separator: " "
      keyValueFormat: "{key}={value}"
      # Optional: custom flag for params file (default: --params-file)
      paramsFileFlag: "--param-file"

  # ============================================================================
  # ENGINE PARAMETER SPECIFICATIONS
  # ============================================================================
  engineParams:
    unknownParamsBehavior: reject
    validatedParams:
      # Execution profile(s)
      - names:
          - "profile"
          - "-profile"
          - "profiles"
        cliFlag: "-profile"
        type: list
        default: ["docker"]
        strictDefault: false
        required: false
        sensitive: false
        listSeparator: ","
        validate:
          - type: enum
            allowed:
              ["docker", "local", "k8s", "aws", "gcp", "azure", "singularity"]
            message: "Profile must be one of: docker, local, k8s, aws, gcp, azure, singularity"
        description: "Execution profile(s) to use. Multiple profiles can be combined."

      # Resume previous run
      - names:
          - "resume"
          - "-resume"
        cliFlag: "-resume"
        type: bool
        default: false
        strictDefault: false
        required: false
        sensitive: false
        booleanStyle: "flag"
        description: "Resume previous run from cached results"

      # Working directory
      - names:
          - "work-dir"
          - "-work-dir"
          - "-w"
        cliFlag: "-work-dir"
        type: string
        default: null
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: regex
            pattern: "^/[a-zA-Z0-9/_-]+$"
            message: "Work directory must be an absolute path with valid characters"
          - type: custom
            rule: "no_parent_traversal"
            message: "Path traversal (..) is not allowed"
        description: "Working directory for intermediate execution files"

      # Maximum CPUs
      - names:
          - "max-cpus"
          - "maxCpus"
        cliFlag: "--max-cpus"
        type: int
        default: null
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: range
            min: 1
            max: 128
            message: "CPU count must be between 1 and 128"
        description: "Maximum number of CPUs to use across all tasks"

      # Maximum memory
      - names:
          - "max-memory"
          - "maxMemory"
        cliFlag: "--max-memory"
        type: string
        default: "16GB"
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: regex
            pattern: "^[0-9]+(\\.[0-9]+)?(GB|MB|TB)$"
            message: "Memory must be specified as number with unit (e.g., 16GB, 1.5TB)"
        description: "Maximum memory to use (e.g., 16GB, 1.5TB)"

      # Output directory
      - names:
          - "output-dir"
          - "outdir"
        cliFlag: "--outdir"
        type: string
        default: "{workdir}/outputs"
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: regex
            pattern: "^/[a-zA-Z0-9/_-]+$"
            message: "Output directory must be an absolute path"
          - type: custom
            rule: "no_parent_traversal"
        description: "Directory where workflow outputs will be saved"

      # Tower access token (sensitive - passed as env var)
      - names:
          - "access-token"
          - "token"
          - "tower-token"
        cliFlag: "-with-tower"
        type: string
        default: null
        strictDefault: false
        required: false
        sensitive: true
        envVar: "TOWER_ACCESS_TOKEN"
        validate:
          - type: regex
            pattern: "^[a-zA-Z0-9_-]{20,}$"
            message: "Token must be alphanumeric and at least 20 characters"
        description: "Access token for Nextflow Tower monitoring"

      # Config file
      - names:
          - "config"
          - "-c"
        cliFlag: "-c"
        type: string
        default: null
        strictDefault: false
        required: false
        sensitive: false
        validate:
          - type: file_exists
            message: "Config file must exist and be readable"
          - type: file_extension
            allowed: [".config", ".cfg", ".conf"]
            message: "Config file must have .config, .cfg, or .conf extension"
        description: "Path to additional Nextflow configuration file"

      # Trace options
      - names:
          - "with-trace"
        cliFlag: "-with-trace"
        type: bool
        default: true
        strictDefault: false
        required: false
        sensitive: false
        booleanStyle: "flag"
        description: "Enable execution tracing"

      # Timeline options
      - names:
          - "with-timeline"
        cliFlag: "-with-timeline"
        type: bool
        default: true
        strictDefault: false
        required: false
        sensitive: false
        booleanStyle: "flag"
        description: "Enable timeline report generation"

      # DAG visualization
      - names:
          - "with-dag"
        cliFlag: "-with-dag"
        type: bool
        default: false
        strictDefault: false
        required: false
        sensitive: false
        booleanStyle: "flag"
        description: "Generate DAG visualization"

  # ============================================================================
  # SECURITY: DENIED PARAMETERS
  # ============================================================================
  deniedParams:
    - pattern: "--admin-password"
      type: exact
      reason: "Admin credentials are not allowed"

    - pattern: "--privileged"
      type: exact
      reason: "Privileged mode is a container escape risk"

    - pattern: "-with-docker"
      type: exact
      reason: "Use 'profile' parameter instead"

    - pattern: "--root"
      type: exact
      reason: "Root access is not permitted"

    - pattern: ".*rm\\s+-rf\\s+/.*"
      type: regex
      reason: "Dangerous system command detected"

    - pattern: ".*\\$\\(.*\\).*"
      type: regex
      reason: "Shell command substitution is not allowed"

    - pattern: ".*`.*`.*"
      type: regex
      reason: "Shell command execution via backticks is not allowed"

  # ============================================================================
  # IGNORED PARAMETERS
  # ============================================================================
  ignoredParams:
    - "--debug-internal"
    - "--experimental-feature-x"

# ============================================================================
# RUNS CONFIGURATION
# ============================================================================
runs:
  workdir:
    base: "/tmp/metis_test"
    pattern: "{user_id}/{run_id}"
    subdirs:
      logs: "logs"
      outputs: "outputs"
      work: "work"
      temp: "tmp"

  config:
    filepath: "nextflow.config"
    content: |
      // Auto-generated per-run config
      process {
        cpus = 4
        memory = '8 GB'
      }
