[env]
_.file = ".env"
_.source = ".envrc"

[shell_alias]
mr = "mise run"

[tasks.bench]
description = "Run benchmarks with criterion"
run = "cargo criterion"

[tasks.check]
alias = [ "c" ]
depends = [ "format", "lefthook", "lint", "lint-sql" ]
description = "Run all code quality checks"
run = "echo 'All checks passed'"

[tasks.format]
alias = [ "f" ]
description = "Format Rust code"
run = "cargo +nightly fmt"

[tasks.lefthook]
description = "Run repo hygiene on all files"
run = "lefthook run pre-commit --all-files"

[tasks.lint]
alias = [ "l" ]
description = "Run clippy linter"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint-sql]
alias = [ "ls" ]
description = "Lint SQL migrations with sqlfluff"
run = "mise x -- sqlfluff lint --dialect postgres migrations/"

[tasks.migrate-create]
alias = "mc"
description = "Create a new SQL migration"
run = '''
read -p "Migration name: " NAME
NORMALIZED_NAME=$(echo "$NAME" \
  | tr '[:upper:]' '[:lower:]' \
  | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
  | sed -E 's/[[:space:]]+/_/g')
migrate create -ext sql -dir migrations -seq "$NORMALIZED_NAME"
'''

[tools]
"cargo:cargo-criterion" = "1.1.0"
gomigrate = "4.19.1"
lefthook = "2.1.1"
"npm:@commitlint/cli" = "20.4.1"
"npm:@commitlint/config-conventional" = "20.4.1"
"npm:eclint" = "2.8.1"
"npm:markdownlint-cli" = "0.47.0"
"pipx:sqlfluff" = "4.0.4"
"pipx:toml-sort" = "0.23.1"
rust = "1.93.1"
shfmt = "3.12.0"
taplo = "0.10.0"
typos = "1.43.4"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
